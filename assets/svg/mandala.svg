<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none" stroke="#ffc93c" stroke-width="1.4">
  <g transform="translate(400 400)">
    <circle r="380"/>
    <circle r="340"/>
    <circle r="250"/>
    <circle r="170"/>
    <circle r="90"/>
    <circle r="40"/>
    <!-- petal ring 1 -->
    <g>
      <g id="petal-a">
        <path d="M0 -380 C 40 -320 40 -280 0 -250 C -40 -280 -40 -320 0 -380 Z"/>
      </g>
      <use href="#petal-a" transform="rotate(30)"/>
      <use href="#petal-a" transform="rotate(60)"/>
      <use href="#petal-a" transform="rotate(90)"/>
      <use href="#petal-a" transform="rotate(120)"/>
      <use href="#petal-a" transform="rotate(150)"/>
      <use href="#petal-a" transform="rotate(180)"/>
      <use href="#petal-a" transform="rotate(210)"/>
      <use href="#petal-a" transform="rotate(240)"/>
      <use href="#petal-a" transform="rotate(270)"/>
      <use href="#petal-a" transform="rotate(300)"/>
      <use href="#petal-a" transform="rotate(330)"/>
    </g>
    <!-- petal ring 2 -->
    <g>
      <g id="petal-b">
        <path d="M0 -250 C 55 -210 55 -150 0 -110 C -55 -150 -55 -210 0 -250 Z"/>
      </g>
      <use href="#petal-b" transform="rotate(22.5)"/>
      <use href="#petal-b" transform="rotate(45)"/>
      <use href="#petal-b" transform="rotate(67.5)"/>
      <use href="#petal-b" transform="rotate(90)"/>
      <use href="#petal-b" transform="rotate(112.5)"/>
      <use href="#petal-b" transform="rotate(135)"/>
      <use href="#petal-b" transform="rotate(157.5)"/>
      <use href="#petal-b" transform="rotate(180)"/>
      <use href="#petal-b" transform="rotate(202.5)"/>
      <use href="#petal-b" transform="rotate(225)"/>
      <use href="#petal-b" transform="rotate(247.5)"/>
      <use href="#petal-b" transform="rotate(270)"/>
      <use href="#petal-b" transform="rotate(292.5)"/>
      <use href="#petal-b" transform="rotate(315)"/>
      <use href="#petal-b" transform="rotate(337.5)"/>
    </g>
    <!-- inner lotus -->
    <g>
      <g id="petal-c">
        <path d="M0 -90 C 26 -66 26 -30 0 -8 C -26 -30 -26 -66 0 -90 Z"/>
      </g>
      <use href="#petal-c" transform="rotate(45)"/>
      <use href="#petal-c" transform="rotate(90)"/>
      <use href="#petal-c" transform="rotate(135)"/>
      <use href="#petal-c" transform="rotate(180)"/>
      <use href="#petal-c" transform="rotate(225)"/>
      <use href="#petal-c" transform="rotate(270)"/>
      <use href="#petal-c" transform="rotate(315)"/>
    </g>
    <!-- dotted ring -->
    <g fill="#ffc93c" stroke="none">
      <circle cx="0" cy="-305" r="4"/>
      <circle cx="152" cy="-264" r="4"/>
      <circle cx="264" cy="-152" r="4"/>
      <circle cx="305" cy="0" r="4"/>
      <circle cx="264" cy="152" r="4"/>
      <circle cx="152" cy="264" r="4"/>
      <circle cx="0" cy="305" r="4"/>
      <circle cx="-152" cy="264" r="4"/>
      <circle cx="-264" cy="152" r="4"/>
      <circle cx="-305" cy="0" r="4"/>
      <circle cx="-264" cy="-152" r="4"/>
      <circle cx="-152" cy="-264" r="4"/>
    </g>
